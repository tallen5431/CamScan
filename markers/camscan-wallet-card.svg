<text x="98.6" y="112.60" font-family="sans-serif" font-size="2.6">    parts: a ruler or sheet along the part.</text>
<text x="98.6" y="117.20" font-family="sans-serif" font-size="2.6" font-weight="700">Read the ± in CamScan; calipers for tight fits.</text>
