<line x1="51.0" y1="22.6" x2="51.0" y2="25.4" stroke="#000" stroke-width="0.4"/>
<line x1="81.0" y1="22.6" x2="81.0" y2="25.4" stroke="#000" stroke-width="0.4"/>
<text x="51.0" y="28.5" font-family="sans-serif" font-size="2.6" fill="#222">Check: this bar = 30 mm</text>
<text x="51.0" y="33.0" font-family="sans-serif" font-size="2.6" fill="#222">Square = 30 mm</text>
<text x="51.0" y="39.0" font-family="sans-serif" font-size="2.3" fill="#444">Lay flat on the face</text>
<text x="51.0" y="42.5" font-family="sans-serif" font-size="2.3" fill="#444">you photograph.</text>
<text x="14.0" y="60.0" font-family="sans-serif" font-size="2.3" fill="#444">Printed at 100 %? The bar must measure 30 mm.</text>
<rect x="93.6" y="10.0" width="85.6" height="54.0" fill="#fff" stroke="#999" stroke-width="0.2"/>
<text x="98.6" y="18.00" font-family="sans-serif" font-size="3.2" font-weight="700">How to shoot</text>
<text x="98.6" y="23.00" font-family="sans-serif" font-size="2.6">1  Lay this card FLAT on the face you measure,</text>
<text x="98.6" y="27.60" font-family="sans-serif" font-size="2.6">    next to the part — not on the floor beside it.</text>
<text x="98.6" y="32.20" font-family="sans-serif" font-size="2.6">2  Phone straight above, parallel to the surface.</text>
<text x="98.6" y="36.80" font-family="sans-serif" font-size="2.6">3  Fill the frame with the part and the card.</text>
<text x="98.6" y="41.40" font-family="sans-serif" font-size="2.6">4  Sharp and no glare on the card.</text>
<text x="98.6" y="46.00" font-family="sans-serif" font-size="2.6">5  Measure up to ~5x the card's size; bigger</text>
<text x="98.6" y="50.60" font-family="sans-serif" font-size="2.6">    parts: a ruler or sheet along the part.</text>
<text x="98.6" y="55.20" font-family="sans-serif" font-size="2.6" font-weight="700">Read the ± in CamScan; calipers for tight fits.</text>
<line x1="93.6" y1="8.0" x2="93.6" y2="66.0" stroke="#666" stroke-width="0.25" stroke-dasharray="1.2,1"/>
<rect x="8.0" y="72.0" width="85.6" height="54.0" fill="#fff" stroke="#999" stroke-width="0.2"/>
<text x="14.0" y="78.5" font-family="sans-serif" font-size="3.2" font-weight="700">CamScan marker card</text>
