<text x="8" y="6" font-family="sans-serif" font-size="3" fill="#333">Print at 100 % (no "fit to page"). Cut round each pair, fold on the dashed line, glue or laminate.</text>
<rect x="8.0" y="10.0" width="85.6" height="54.0" fill="#fff" stroke="#999" stroke-width="0.2"/>
<text x="14.0" y="16.5" font-family="sans-serif" font-size="3.2" font-weight="700">CamScan marker card</text>
<rect x="14.0" y="20.0" width="30.0" height="30.0" fill="#000"/>
<rect x="19.000" y="25.000" width="8.000" height="8.000" fill="#fff"/>
