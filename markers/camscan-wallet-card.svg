<text x="98.6" y="80.00" font-family="sans-serif" font-size="3.2" font-weight="700">How to shoot</text>
<text x="98.6" y="85.00" font-family="sans-serif" font-size="2.6">1  Lay this card FLAT on the face you measure,</text>
<text x="98.6" y="89.60" font-family="sans-serif" font-size="2.6">    next to the part — not on the floor beside it.</text>
<text x="98.6" y="94.20" font-family="sans-serif" font-size="2.6">2  Phone straight above, parallel to the surface.</text>
<text x="98.6" y="98.80" font-family="sans-serif" font-size="2.6">3  Fill the frame with the part and the card.</text>
<text x="98.6" y="103.40" font-family="sans-serif" font-size="2.6">4  Sharp and no glare on the card.</text>
